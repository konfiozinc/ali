<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Página no encontrada · Alí Binary Options Pro</title>
  <meta name="robots" content="noindex" />
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta http-equiv="X-Frame-Options" content="DENY">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --bg:#070c1a; --accent:#00d4ff; --accent2:#00ff88; --text:#e8f4f8; --muted:#7a9ab5; }
    html, body { height: 100%; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex; align-items: center; justify-content: center;
      background-image:
        linear-gradient(rgba(0,212,255,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,212,255,0.04) 1px, transparent 1px);
      background-size: 40px 40px;
      padding: 24px; text-align: center;
    }
    .card { max-width: 480px; }
    .brand {
      font-family: 'Orbitron', sans-serif; font-weight: 900; letter-spacing: .12em;
      font-size: 1.1rem; color: var(--accent); text-transform: uppercase; margin-bottom: 28px;
    }
    .code {
      font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 6rem; line-height: 1;
      color: var(--accent); text-shadow: 0 0 40px rgba(0,212,255,0.45); margin-bottom: 14px;
    }
    h1 { font-size: 1.4rem; font-weight: 600; margin-bottom: 10px; }
    p { color: var(--muted); font-size: .95rem; line-height: 1.6; margin-bottom: 28px; }
    .btn {
      display: inline-block; padding: 14px 28px; border-radius: 12px; text-decoration: none;
      font-weight: 600; font-size: .95rem; color: #062b16; background: var(--accent2);
      box-shadow: 0 0 30px rgba(0,255,136,0.35); transition: transform .16s;
    }
    .btn:hover { transform: translateY(-2px); }
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">Alí Binary Options Pro</div>
    <div class="code">404</div>
    <h1>Página no encontrada</h1>
    <p>La dirección que buscas no existe o fue movida.<br>Vuelve al inicio para entrar a la sala.</p>
    <a class="btn" href="https://konfiozinc.github.io/ali/">Volver al inicio</a>
  </main>
</body>
</html>
